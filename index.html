<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGN Fibra - Controle de Pausas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --vermelho-mgn: #E61C24;
    --vermelho-glow: rgba(230, 28, 36, 0.15);
    --bg-dark: #050505;
    --panel-bg: #0A0A0A;
    --input-bg: #141414;
    --text-main: #FFFFFF;
    --text-muted: #A0A0A0;
    --border-dark: #222222;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 0% 50%, rgba(230,28,36,0.1) 0%, transparent 50%),
      radial-gradient(circle at 100% 80%, rgba(230,28,36,0.1) 0%, transparent 40%),
      linear-gradient(to bottom, rgba(230,28,36,0.02) 1px, transparent 1px),
      linear-gradient(to right, rgba(230,28,36,0.02) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 30px 20px;
  }

  .app-container {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  /* HEADER */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .logo-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo-wrapper .wifi-icon {
    margin-bottom: 5px;
    fill: var(--vermelho-mgn);
  }

  .logo-text {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-text span {
    color: var(--vermelho-mgn);
    font-style: italic;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-main);
    letter-spacing: 0.5px;
    margin-top: -5px;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 15px;
    background: var(--panel-bg);
    border: 1px solid var(--border-dark);
    border-radius: 12px;
    padding: 12px 20px;
  }

  .badge-icon {
    width: 24px; height: 24px;
    stroke: var(--vermelho-mgn);
  }

  .badge-info h3 {
    font-size: 14px; font-weight: 600; margin-bottom: 2px;
  }

  .badge-info p {
    font-size: 12px; color: var(--text-muted);
  }

  /* MAIN CONTENT */
  main {
    display: flex;
    gap: 40px;
    align-items: stretch;
  }

  .left-col {
    flex: 0 0 400px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .left-col img {
    width: 100%;
    max-width: 400px;
    object-fit: contain;
    filter: drop-shadow(0px 0px 30px rgba(230,28,36,0.2));
  }

  .right-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 25px;
  }

  /* PANELS */
  .panel {
    background: var(--panel-bg);
    border: 1px solid rgba(230, 28, 36, 0.4);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 0 20px var(--vermelho-glow), inset 0 0 10px rgba(230,28,36,0.05);
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 25px;
  }

  .panel-header svg {
    fill: var(--vermelho-mgn);
    width: 20px; height: 20px;
  }

  /* FORM ELEMENTS */
  .form-group {
    margin-bottom: 20px;
  }

  .form-group > label {
    display: block;
    font-size: 14px;
    color: var(--text-main);
    margin-bottom: 10px;
    font-weight: 500;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrapper input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border-dark);
    color: var(--text-main);
    padding: 16px 45px 16px 16px;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: all 0.3s;
  }

  .input-wrapper input:focus {
    border-color: var(--vermelho-mgn);
    box-shadow: 0 0 10px rgba(230,28,36,0.1);
  }

  .input-wrapper input::placeholder {
    color: var(--text-muted);
  }

  /* SELECT DE ATENDENTES */
  .input-wrapper select {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border-dark);
    color: var(--text-main);
    padding: 16px 45px 16px 16px;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    transition: all 0.3s;
  }

  .input-wrapper select:focus {
    border-color: var(--vermelho-mgn);
    box-shadow: 0 0 10px rgba(230,28,36,0.1);
  }

  .input-wrapper select option {
    background: var(--input-bg);
    color: var(--text-main);
  }

  .input-wrapper svg {
    position: absolute;
    right: 16px;
    width: 20px; height: 20px;
    stroke: var(--text-muted);
    pointer-events: none;
  }

  /* RADIO GRID */
  .pausa-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  .card-option {
    position: relative;
    cursor: pointer;
  }

  .card-option input[type="radio"] {
    position: absolute;
    opacity: 0;
  }

  .card-content {
    background: var(--input-bg);
    border: 1px solid var(--border-dark);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 15px;
    transition: all 0.2s ease;
    font-size: 14px;
    font-weight: 500;
  }

  .icon-box {
    width: 40px; height: 40px;
    background: rgba(230,28,36,0.08);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-box svg {
    width: 20px; height: 20px;
    fill: var(--vermelho-mgn);
  }

  /* Radio checked state */
  .card-option input[type="radio"]:checked + .card-content {
    border-color: var(--vermelho-mgn);
    background: rgba(230,28,36,0.1);
  }

  /* BUTTONS */
  .btn {
    width: 100%;
    padding: 18px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.3s;
    border: none;
    margin-top: 10px;
  }

  .btn:disabled {
    opacity: 0.6; cursor: not-allowed;
  }

  .btn-primary {
    background: linear-gradient(90deg, #FF1A1A 0%, #B30000 100%);
    color: #FFF;
    box-shadow: 0 4px 15px rgba(230,28,36,0.3);
  }

  .btn-primary:hover:not(:disabled) {
    box-shadow: 0 6px 20px rgba(230,28,36,0.5);
  }

  .btn-primary svg {
    fill: #FFF; width: 18px; height: 18px;
  }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--vermelho-mgn);
    color: #FFF;
  }

  .btn-outline:hover:not(:disabled) {
    background: rgba(230,28,36,0.1);
  }

  .btn-outline svg {
    stroke: #FFF; fill: none; width: 18px; height: 18px;
  }

  .msg-alert {
    text-align: center; font-size: 13px; margin-top: 12px; min-height: 16px;
  }
  .msg-alert.success { color: #4CAF50; }
  .msg-alert.error { color: var(--vermelho-mgn); }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    main { flex-direction: column; align-items: center; }
    .left-col { flex: 0 0 auto; max-width: 300px; }
  }
  @media (max-width: 600px) {
    header { flex-direction: column; align-items: center; gap: 20px; }
    .pausa-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<script>
  // Mude para o link do seu Web App Script original
  const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzQq7wnS2n1ZZaLlFvlsdMgaGm0aocAGZU-Dys5u_JEb5gKhENRkpsm5crbrlruRWU4fA/exec";
  const SENHA = "mgn2024";

  // ===== EDITE APENAS AQUI PARA INCLUIR OU REMOVER ATENDENTES =====
  const ATENDENTES = [
    "Cassia",
    "Denyse",
    "Greice",
    "Guilherme",
    "Mirella",
    "Odeny",
    "Vitoria"
  ];
  // ================================================================

  function montarListas(){
    var salvo = localStorage.getItem('mgn_atendente') || "";

    ["nomeInicio","nomeVolta"].forEach(function(id){
      var sel = document.getElementById(id);
      sel.innerHTML = '<option value="">Selecione seu nome</option>';
      ATENDENTES.forEach(function(nome){
        var opt = document.createElement('option');
        opt.value = nome;
        opt.textContent = nome;
        sel.appendChild(opt);
      });
      if (ATENDENTES.indexOf(salvo) !== -1) sel.value = salvo;
    });

    // Escolheu na ida: marca o mesmo nome na volta e guarda nesta maquina
    document.getElementById('nomeInicio').addEventListener('change', function(){
      document.getElementById('nomeVolta').value = this.value;
      if (this.value) localStorage.setItem('mgn_atendente', this.value);
    });

    // Se trocar direto no campo da volta, atualiza tambem
    document.getElementById('nomeVolta').addEventListener('change', function(){
      if (this.value) localStorage.setItem('mgn_atendente', this.value);
    });
  }
  montarListas();

  function formatDateTime(){
    const d = new Date();
    const data = d.toLocaleDateString('pt-BR');
    const hora = d.toLocaleTimeString('pt-BR');
    return {data, hora};
  }

  function displayMessage(elId, texto, isSuccess){
    const el = document.getElementById(elId);
    el.textContent = texto;
    el.className = 'msg-alert ' + (isSuccess ? 'success' : 'error');
  }

  // Engine Iniciar Pausa
  document.getElementById('btnIniciar').addEventListener('click', async () => {
    const nome = document.getElementById('nomeInicio').value;
    const tipoEl = document.querySelector('input[name="tipo"]:checked');

    if(!nome){ displayMessage('msgIniciar','Selecione seu nome antes de iniciar.', false); return; }
    if(!tipoEl){ displayMessage('msgIniciar','Selecione o tipo de pausa.', false); return; }

    const {data, hora} = formatDateTime();
    const btn = document.getElementById('btnIniciar');
    btn.disabled = true;
    displayMessage('msgIniciar','Enviando comando para o servidor...', true);

    try {
      await fetch(URL_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({
          senha: SENHA,
          acao: 'iniciar',
          nome: nome,
          tipo: tipoEl.value,
          data: data,
          horaInicio: hora
        })
      });
      displayMessage('msgIniciar', 'Operação concluída. Pausa iniciada às ' + hora + '.', true);
    } catch(err) {
      displayMessage('msgIniciar', 'Falha na conexão. Verifique o endpoint.', false);
    }
    btn.disabled = false;
  });

  // Engine Voltar da Pausa
  document.getElementById('btnVoltar').addEventListener('click', async () => {
    const nome = document.getElementById('nomeVolta').value;
    if(!nome){ displayMessage('msgVoltar','Selecione seu nome antes de registrar o retorno.', false); return; }

    const {hora} = formatDateTime();
    const btn = document.getElementById('btnVoltar');
    btn.disabled = true;
    displayMessage('msgVoltar','Enviando comando para o servidor...', true);

    try {
      await fetch(URL_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({
          senha: SENHA,
          acao: 'finalizar',
          nome: nome,
          horaFim: hora
        })
      });
      displayMessage('msgVoltar', 'Operação concluída. Retorno registrado às ' + hora + '.', true);
    } catch(err) {
      displayMessage('msgVoltar', 'Falha na conexão. Verifique o endpoint.', false);
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
